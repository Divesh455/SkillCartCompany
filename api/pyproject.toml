[project]
name = "skillcart-company-api"
version = "0.1.0"
description = "FastAPI backend for SkillCart Company"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.111.0",
    "uvicorn[standard]==0.30.1",
    "SQLAlchemy==2.0.30",
    "psycopg2-binary==2.9.12",
    "PyMySQL==1.1.0",
]

[tool.fastapi]
entrypoint = "main:app"
